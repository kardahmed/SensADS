name: Uptime check

on:
  schedule:
    # Toutes les 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  ping:
    name: Ping endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Supabase health endpoint
        id: health
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          set +e
          HTTP_CODE=$(curl -m 10 -sw '%{http_code}' -o /tmp/health.json "$SUPABASE_URL/functions/v1/health")
          BODY=$(cat /tmp/health.json 2>/dev/null || echo '{}')
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "body=$BODY" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Supabase health DOWN: $HTTP_CODE"
            exit 1
          fi
          echo "Supabase health OK"

      - name: Ping app.sensads.com
        id: app
        run: |
          set +e
          HTTP_CODE=$(curl -m 10 -sw '%{http_code}' -o /dev/null "https://app.sensads.com/")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "301" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "App DOWN: $HTTP_CODE"
            exit 1
          fi
          echo "App OK ($HTTP_CODE)"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const timestamp = new Date().toISOString();
            const title = `🚨 DOWN at ${timestamp}`;

            // Vérifier si une issue "down" est déjà ouverte
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'down',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still down at ${timestamp} (run: ${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Health endpoint returned non-200 status.\n\nRun: ${context.payload.repository.html_url}/actions/runs/${context.runId}`,
              labels: ['down', 'incident'],
            });

      - name: Auto-close down issues if back up
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'down',
            });

            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Back up at ${new Date().toISOString()}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                labels: ['down', 'resolved'],
              });
            }
