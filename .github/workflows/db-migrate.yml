name: Apply DB migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tape EXACTEMENT "APPLY MIGRATIONS" pour confirmer'
        required: true
        type: string

concurrency:
  group: db-migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply SQL migrations to Supabase
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    if: github.event.inputs.confirm == 'APPLY MIGRATIONS'
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16

      - name: Verify connection
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ SUPABASE_DB_URL secret missing"
            echo "Add it in GitHub Settings > Secrets > Actions"
            echo "Format: postgresql://postgres:PASSWORD@db.PROJECT.supabase.co:5432/postgres"
            exit 1
          fi
          psql "$DATABASE_URL" -c "SELECT version();" -tA

      - name: List existing tables (safety check)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "=== Existing public tables ==="
          psql "$DATABASE_URL" -c "\dt public.*" || true
          echo ""
          echo "=== Existing types ==="
          psql "$DATABASE_URL" -c "SELECT typname FROM pg_type WHERE typnamespace=(SELECT oid FROM pg_namespace WHERE nspname='public') AND typtype='e';" -tA || true

      - name: Set encryption key for pgcrypto
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGCRYPTO_KEY: ${{ secrets.PGCRYPTO_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PGCRYPTO_KEY" ]; then
            echo "❌ PGCRYPTO_KEY secret missing — generate via: openssl rand -base64 32"
            exit 1
          fi
          # Set as DB-level setting (persists across sessions)
          psql "$DATABASE_URL" <<SQL
            ALTER DATABASE postgres SET app.encryption_key = '${PGCRYPTO_KEY}';
          SQL

      - name: Apply migrations in order
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          for f in supabase/migrations/*.sql; do
            echo ""
            echo "=== Applying $(basename $f) ==="
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
            echo "✓ $(basename $f) done"
          done

      - name: Apply seed (app_settings)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -f supabase/seed.sql ]; then
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
          fi

      - name: Verify final state
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo "=== Tables created ==="
          TABLES=$(psql "$DATABASE_URL" -tA -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")
          echo "Total public tables: $TABLES"
          if [ "$TABLES" -lt 28 ]; then
            echo "⚠️ Expected at least 28 tables, got $TABLES"
            exit 1
          fi

          echo ""
          echo "=== Tariffs seed ==="
          TARIFFS=$(psql "$DATABASE_URL" -tA -c "SELECT count(*) FROM platform_tariffs;")
          echo "Tariffs: $TARIFFS"
          if [ "$TARIFFS" -lt 50 ]; then
            echo "⚠️ Expected ≥50 tariffs, got $TARIFFS"
            exit 1
          fi

          echo ""
          echo "=== RLS coverage ==="
          NO_RLS=$(psql "$DATABASE_URL" -tA -c "
            SELECT count(*) FROM pg_tables t
            WHERE schemaname='public'
              AND NOT EXISTS (
                SELECT 1 FROM pg_class c
                WHERE c.oid = (t.schemaname||'.'||t.tablename)::regclass
                  AND c.relrowsecurity = true
              );
          ")
          echo "Tables WITHOUT RLS: $NO_RLS"
          if [ "$NO_RLS" -gt 12 ]; then
            # Some are partitions of audit_logs which is fine
            echo "⚠️ Too many tables without RLS"
            exit 1
          fi

          echo ""
          echo "✅ Migrations OK — backend ready"

      - name: Smoke test — create + delete dummy org (RLS bypass via service role)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" <<SQL
          BEGIN;
            -- Need a profile first (FK organizations.owner_id)
            -- Skip in this smoke test : just verify INSERT path errors gracefully
            DO \$\$
            BEGIN
              RAISE NOTICE 'app_settings count: %', (SELECT count(*) FROM app_settings);
              RAISE NOTICE 'tariffs count: %', (SELECT count(*) FROM platform_tariffs);
              RAISE NOTICE 'benchmarks count: %', (SELECT count(*) FROM global_benchmarks);
            END \$\$;
          ROLLBACK;
          SQL
          echo "✅ Smoke test passed"
